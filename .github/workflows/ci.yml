# Author: JunyoungJung · 2026-10-22
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: macos-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ runner.temp }}/mobile-qa/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare isolated test scratch
        run: mkdir -p "$TMPDIR"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt PyYAML==6.0.2
      - name: Host and storage tests with mocked volumes
        run: python -B -m unittest discover -s tests -v
      - name: QA and image comparison tests
        run: python -B -m unittest discover -s skills/mobile-device-qa/tests -v
      - name: Account and login-profile tests with synthetic credentials
        run: python -B -m unittest discover -s skills/test-accounts/tests -v
      - name: Verify immutable release and public package contents
        run: python -B scripts/package.py --check
      - name: Read-only release diagnostics
        run: python -B scripts/doctor.py --release-only
      - name: Validate manifest and skill structure
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          import yaml
          root = Path('.')
          paths = ['plugin.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', '.agents/plugins/marketplace.json']
          manifests = [json.loads((root / path).read_text()) for path in paths]
          assert manifests[0]['name'] == manifests[1]['name'] == 'mobile-qa'
          assert manifests[0]['version'] == manifests[1]['version'] == '0.1.0'
          for catalog in manifests[2:]:
              assert catalog['plugins'][0]['name'] == 'mobile-qa'
              assert catalog['plugins'][0]['version'] == '0.1.0'
          for path in root.glob('skills/*/SKILL.md'):
              value = path.read_text().split('---', 2)
              data = yaml.safe_load(value[1])
              assert data['name'] == path.parent.name and data['description']
          agent = tomllib.loads((root / 'integrations/codex/mobile-qa-runner.toml').read_text())
          assert all(agent.get(key) for key in ['name', 'description', 'developer_instructions'])
          print('Manifest and skill structure valid; runtime host loading is a separate check.')
          PY
      - name: Claude validator when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
            claude plugin validate .claude-plugin/plugin.json --strict
            claude plugin validate agents --strict
            claude plugin validate skills --strict
          else
            echo "Claude CLI unavailable; static structure was checked above."
          fi
      - name: Scan public source for credentials
        run: |
          brew list gitleaks >/dev/null 2>&1 || brew install gitleaks
          gitleaks dir . --redact --no-banner
